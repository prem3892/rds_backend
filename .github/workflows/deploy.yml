name: CI/CD RDS Docker Deploy

on:
  push:
    branches:
      - main
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repo
        uses: actions/checkout@v3

      # 2. Set up Docker
      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      # 3. Log in to GHCR (GitHub Container Registry)
      - name: Docker login
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4. Build Docker image
      - name: Build Docker image
        run: |
          IMAGE=ghcr.io/lokeshseattle/rds-backend
          BRANCH=${GITHUB_REF_NAME}
          TAG=${GITHUB_SHA::7}

          if [ "$BRANCH" = "main" ]; then
            LATEST_TAG="latest"
          else
            LATEST_TAG="latest-${BRANCH}"
          fi

          echo "Building $IMAGE:$TAG and $IMAGE:$LATEST_TAG"
          docker build -t $IMAGE:$TAG -t $IMAGE:$LATEST_TAG .

      # 5. Push Docker image
      - name: Push Docker image
        run: |
          IMAGE=ghcr.io/lokeshseattle/rds-backend
          BRANCH=${GITHUB_REF_NAME}
          TAG=${GITHUB_SHA::7}

          if [ "$BRANCH" = "main" ]; then
            LATEST_TAG="latest"
          else
            LATEST_TAG="latest-${BRANCH}"
          fi

          echo "Pushing $IMAGE:$TAG and $IMAGE:$LATEST_TAG"
          docker push $IMAGE:$TAG
          docker push $IMAGE:$LATEST_TAG

      # 6. Deploy to the correct EC2 server
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ github.ref_name == 'main' && secrets.EC2_HOST_PROD || secrets.EC2_HOST_DEV }}
          username: ubuntu
          key: ${{ github.ref_name == 'main' && secrets.EC2_SSH_KEY_PROD || secrets.EC2_SSH_KEY_DEV }}
          script: |
            set -e
            cd /home/ubuntu/rds-chat-api

            IMAGE=ghcr.io/lokeshseattle/rds-backend
            BRANCH=${GITHUB_REF_NAME}
            if [ "$BRANCH" = "main" ]; then
              IMAGE_TAG="latest"
            else
              IMAGE_TAG="latest-${BRANCH}"
            fi

            echo "Deploying branch: $BRANCH"
            echo "Pulling image $IMAGE:$IMAGE_TAG..."
            IMAGE_TAG=$IMAGE_TAG docker compose pull backend

            echo "Recreating backend container..."
            IMAGE_TAG=$IMAGE_TAG docker compose up -d --force-recreate --remove-orphans backend

            echo "🧹 Cleaning up old Docker images..."
            docker image prune -af --filter "until=24h"
